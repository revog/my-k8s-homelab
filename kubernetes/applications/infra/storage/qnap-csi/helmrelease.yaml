# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qnap-trident
spec:
  interval: 30m
  chart:
    spec:
      chart: ./Helm/trident 
      sourceRef:
        kind: GitRepository
        name: qnap-csi-plugin
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: trident-values
      valuesKey: values.yaml
