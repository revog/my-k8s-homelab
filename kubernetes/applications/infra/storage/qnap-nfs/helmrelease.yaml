# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-csi-driver
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "4.13.4"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: nfs-csi-values
      valuesKey: values.yaml
