clusterRoleBinding:
  create: false

config:
  inClusterContextName: "homelab"
  pluginsDir: /headlamp/plugins
  oidc:
    secret:
      create: false
    externalSecret:
      enabled: true
      name: headlamp-oidc-secret
      hasScopes: true
    usePKCE: true
  watchPlugins: true

httpRoute:
  enabled: true
  parentRefs:
    - name: internal
      namespace: infra-gateway
    - name: private
      namespace: infra-tailscale # Explicitly points across namespaces to your Tailscale Gateway
  hostnames:
    - 'headlamp.internal.${CLUSTER_DOMAIN}'
    - 'headlamp.private.${CLUSTER_DOMAIN}'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80

persistentVolumeClaim:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 100Mi

pluginsManager:
  enabled: true
  configContent: |
    plugins:
      - name: flux
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
        version: 0.7.0
      - name: cert-manager
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
        version: 0.1.1

serviceAccount:
  create: false

settings:
  configuration:
    plugins:
      "@kinvolk/kubernetes-prometheus":
        homelab:
          prometheusEndpoint: "infra-monitoring/vmsingle-vm:8428"
          prometheusSubpath: ""
