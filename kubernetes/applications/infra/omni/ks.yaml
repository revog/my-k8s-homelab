---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: omni
  namespace: infra-flux
spec:
  interval: 15m
  path: "./kubernetes/applications/infra/omni/app"
  prune: true
  wait: true
  targetNamespace: infra-omni
  sourceRef:
    kind: GitRepository
    name: homelab
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  
