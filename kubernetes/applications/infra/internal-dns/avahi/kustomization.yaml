---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmrelease.yaml
  - namespace.yaml
  - ocirepository.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: avahi-values
    files:
      - values.yaml
