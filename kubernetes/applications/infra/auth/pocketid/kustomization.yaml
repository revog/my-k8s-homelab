---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmrelease.yaml
  - helmrepository.yaml
  - httproute.yaml
  - namespace.yaml
  - secret.age.enc.yaml

components:
  - ../../../components/volsync

configMapGenerator:
  - name: pocketid-values
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: StatefulSet
      name: pocketid
    patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/metadata/labels/volsync.backube~1restore
        value: "true"
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/dataSourceRef
        value:
          apiGroup: volsync.backube
          kind: ReplicationDestination
          name: pocketid-bootstrap
