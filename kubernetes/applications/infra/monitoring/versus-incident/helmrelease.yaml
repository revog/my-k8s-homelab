# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: versus-incident
  namespace: infra-prometheus
spec:
  interval: 1h
  releaseName: versus-incident
  targetNamespace: infra-monitoring
  chartRef:
    kind: OCIRepository
    name: versus-incident
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: versus-incident-values
      valuesKey: values.yaml
