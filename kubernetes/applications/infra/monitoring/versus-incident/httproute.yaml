---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: versus-incident
spec:
  parentRefs:
    - name: private
      namespace: infra-tailscale
    - name: internal
      namespace: infra-gateway
  hostnames:
    - 'incident.internal.${CLUSTER_DOMAIN}'
    - 'incident.private.${CLUSTER_DOMAIN}'
  rules:
    - backendRefs:
        - name: versus-incident-service
          port: 3000
          weight: 100
