config:
  appClientId: "Iv23lirY1XctpLPPM5eE" # <tbd> migrate to KONFLATE_APP_CLIENT_ID in secret
  repo: github://revog/my-k8s-homelab
  statusChecks: true
  prComments: true
  verifyImages: true
  # mcp: true

deploymentAnnotations:
  reloader.stakater.com/auto: "true"

httpRoute:
  enabled: true
  parentRefs:
    - name: private
      namespace: infra-tailscale
    - name: internal
      namespace: infra-gateway
  hostnames:
    - 'konflate.internal.${CLUSTER_DOMAIN}'
    - 'konflate.private.${CLUSTER_DOMAIN}'

networkPolicy:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi

secret:
  existingSecret: konflate-github
