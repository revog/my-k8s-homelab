---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres18-immich
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 2
  # renovate: datasource=docker depName=ghcr.io/immich-app/postgres versioning=loose enabled=true
  imageName: ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.5@sha256:a20e21841b21b9c009daf572c844ffedfaef75fce51287bbf080edf171ef0834
  primaryUpdateStrategy: unsupervised

  # Tolerate brief pod-network blips before failing over
  failoverDelay: 30
  probes:
    liveness:
      isolationCheck:
        enabled: true            # keep split-brain protection
        connectionTimeout: 3000  # default: 1000ms
        requestTimeout: 3000     # default: 1000ms

  storage:
    size: 4Gi
    storageClass: longhorn-v2

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg-superuser
  postgresUID: 999
  postgresGID: 999

  postgresql:
    shared_preload_libraries: ["vchord.so"]
    parameters:
      max_connections: "500"
      shared_buffers: 256MB

  managed:
    roles:
      - name: immich
        superuser: true
        login: true
        passwordSecret:
          name: cloudnative-pg-user-immich

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred

  resources:
    requests:
      cpu: 100m
    limits:
      memory: 2Gi

  monitoring:
    enablePodMonitor: true

  # # pgBackRest Plugin for backup
  # plugins:
  #   - name: pgbackrest.dalibo.com
  #     enabled: true
  #     isWALArchiver: true
  #     parameters:
  #       stanzaRef: postgres18-immich-stanza
  #       pluginConfigRef: postgres18-immich-pluginconfig

  bootstrap:
    initdb:
      database: immich
      owner: immich
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS cube
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE
        - CREATE EXTENSION IF NOT EXISTS vector CASCADE

  # ============================================================================
  # RESTORE FROM BACKUP (commented out - use instead of initdb above)
  # ============================================================================
  # To restore from backup:
  # 1. Comment out the 'initdb' block above
  # 2. Uncomment the 'recovery' block and 'externalClusters' below
  # 3. Optionally add recoveryTarget for point-in-time recovery
  # ============================================================================
  # bootstrap:
  #   recovery:
  #     source: pgbackrest-backup
  #     # Optional: Point-in-time recovery
  #     # recoveryTarget:
  #     #   targetTime: "2025-01-15 10:30:00"  # Restore to specific time
  #     #   # OR use: targetLSN, targetXID, targetImmediate
  #
  # externalClusters:
  #   - name: pgbackrest-backup
  #     plugin:
  #       name: pgbackrest.dalibo.com
  #       parameters:
  #         repositoryRef: postgres18-immich-repository
  #         # Optional: Select which repo to restore from (1=B2, 2=R2)
  #         # selectedRepository: "1"
