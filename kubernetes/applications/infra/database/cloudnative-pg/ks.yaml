---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: infra-flux
spec:
  dependsOn:
    - name: globals
  path: "./kubernetes/applications/infra/database/cloudnative-pg/app"
  wait: true
  interval: 15m
  prune: false
  targetNamespace: infra-database
  sourceRef:
    kind: GitRepository
    name: homelab
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres18-immich
  namespace: infra-flux
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: infra-flux
  path: "./kubernetes/applications/infra/database/cloudnative-pg/postgres18-immich"
  wait: true
  interval: 15m
  prune: false
  targetNamespace: infra-database
  sourceRef:
    kind: GitRepository
    name: homelab
  decryption:
    provider: sops
    secretRef:
      name: sops-age
