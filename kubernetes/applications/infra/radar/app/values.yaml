---
auth:
  mode: oidc
  oidc:
    issuerURL: "https://auth.${CLUSTER_DOMAIN}"
    # Optional internal issuer base URL used by the Radar pod for discovery and
    # derived server-side token/userinfo/JWKS endpoints. Tokens are still
    # validated against issuerURL, and browser redirects stay browser-facing.
    internalIssuerURL: ""  # <TBD>
    clientID: <TBD>
    existingSecret: radar-oidc-secret
    clientSecretKey: "client-secret"
    redirectURL: "https://radar.internal.${CLUSTER_DOMAIN}/auth/callback"
    # Enable OIDC Back-Channel Logout endpoint. When enabled, the IdP can POST
    # a signed logout_token to /auth/backchannel-logout to revoke sessions.
    backchannelLogout: true
    enablePKCE: true

httpRoute:
  enabled: true
  parentRefs:
    - name: internal
      namespace: infra-gateway
    - name: private
      namespace: infra-tailscale # Explicitly points across namespaces to your Tailscale Gateway
  hostnames:
    - 'radar.internal.${CLUSTER_DOMAIN}'
    - 'radar.private.${CLUSTER_DOMAIN}'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      timeouts:
        request: 30s
        backendRequest: 20s
      backendRefs:
        - name: radar
          port: 9280
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      timeouts:
        request: 2m
      backendRefs:
        - name: radar
          port: 9280        
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: radar
          port: 9280

rbac:
  additionalRules:
    - apiGroups:
        - "source.toolkit.fluxcd.io"
        - "kustomize.toolkit.fluxcd.io"
        - "helm.toolkit.fluxcd.io"
        - "notification.toolkit.fluxcd.io"
        - "image.toolkit.fluxcd.io"
      resources: ["*"]
      verbs: ["patch"]

timeline:
  storage: postgres
  retention: 168h
  postgres:
    existingSecret: radar-postgres-owner
    secretKey: "uri"
