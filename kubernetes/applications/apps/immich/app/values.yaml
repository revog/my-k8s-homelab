---
controllers:
  main:
    strategy: Recreate
    pod:
      annotations:
        reloader.stakater.com/auto: "true"
      resourceClaims:
        - name: intel-gpu
          resourceClaimTemplateName: immich-gpu
    containers:
      main:
        image:
          repository: ghcr.io/immich-app/immich-server
          tag: v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
        env:
          DB_DATABASE_NAME:
            valueFrom:
              secretKeyRef:
                name: immich-secret
                key: DB_DATABASE_NAME
          DB_HOSTNAME:
            valueFrom:
              secretKeyRef:
                name: immich-secret
                key: DB_HOSTNAME
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-secret
                key: DB_USERNAME
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-secret
                key: DB_PASSWORD
          IMMICH_CONFIG_FILE: /config/immich-config.yaml
          IMMICH_HELMET_FILE: "true"
          IMMICH_MEDIA_LOCATION: &mediaLocation /data
          REDIS_HOSTNAME: redis
          REDIS_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: redis-secret
                key: redis-password
          TZ: ${CLUSTER_TIMEZONE}
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 4Gi
          claims:
            - name: intel-gpu
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1004
    runAsGroup: 1004
    fsGroup: 1004
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }
  nodeSelector:
    intel.feature.node.kubernetes.io/gpu: "true"

immich:
  configurationKind: Secret
  existingConfiguration: immich-secret
  metrics:
    enabled: true
  persistence:
    library:
      existingClaim: immich-library # Replace with NFS PVC (immich-library-nfs) after migration

machine-learning:
  enabled: true
  controllers:
    main:
      strategy: Recreate
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.4.1-openvino
          env:
            TRANSFORMERS_CACHE: /cache
            TZ: ${CLUSTER_TIMEZONE}
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 8Gi
            claims:
              - name: intel-gpu
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
  persistence:
    cache:
      enabled: true
      accessMode: ReadWriteOnce
      type: persistentVolumeClaim
      size: 10Gi
      storageClass: longhorn-v2
    library-nfs:
      enabled: false  # mount library only in immich server pod

persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  # Temp during migration - to be removed after
  library-nfs:
    enabled: true
    type: persistentVolumeClaim
    forceRename: immich-library-nfs
    storageClass: qnap-nfs
    accessMode: ReadWriteMany
    retain: true
    size: 100Gi
    advancedMounts:
      main:
        main:
          - path: /immich-library-nfs
  # Temp during migration - to be removed after

route:
  immich-server:
    hostnames:
      - photos.${CLUSTER_DOMAIN}
      - photos.internal.${CLUSTER_DOMAIN}
      - photos.private.${CLUSTER_DOMAIN}
    parentRefs:
      - name: internal
        namespace: infra-gateway
      - name: private
        namespace: infra-tailscale
      - name: public
        namespace: infra-gateway
    rules:
      - backendRefs:
          - name: immich-server
            port: &port 2283

service:
  main:
    controller: main
    ports:
      http:
        port: *port

valkey:
  enabled: false
