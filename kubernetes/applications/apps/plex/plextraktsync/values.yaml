# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
---
controllers:
  # Live scrobbling
  plextraktsync-watch:
    type: deployment
    replicas: 1
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/taxel/plextraktsync
          tag: latest
        command: ["plextraktsync", "watch"]
        env:
          PLEXAPI_HEADER_IDENTIFIER: "plextraktsync"

  # Regular sync
  plextraktsync-sync:
    type: cronjob
    cronjob:
      schedule: "0 * * * *" # Run every hour
      concurrencyPolicy: Forbid
    containers:
      app:
        image:
          repository: ghcr.io/taxel/plextraktsync
          tag: latest
        command: ["plextraktsync", "sync"]
        env:
          PLEXAPI_HEADER_IDENTIFIER: "plextraktsync"

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1005
    runAsGroup: 1005
    fsGroup: 1005
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

persistence:
  config-secret:
    enabled: true
    type: secret
    name: plextraktsync-creds
    globalMounts:
      - subPath: .env
        path: /app/config/.env
      - subPath: .pytrakt.json
        path: /app/config/.pytrakt.json
      - subPath: config.yml
        path: /app/config/config.yml
      - subPath: servers.yml
        path: /app/config/servers.yml
