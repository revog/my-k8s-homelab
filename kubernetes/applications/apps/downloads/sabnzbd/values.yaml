---
controllers:
  sabnzbd:
    pod:
      annotations:
        reloader.stakater.com/auto: "true"
    containers:
      sabnzbd:
        image:
          repository: ghcr.io/home-operations/sabnzbd
          tag: 5.1.3@sha256:07790a7829201d9ea302e8b862078beac4b1a07003fe8359e3f069b6bcd84a95
        env:
          PUID: 1306
          PGID: 1306
          SABNZBD__PORT: &port 80
          SABNZBD__HOST_WHITELIST_ENTRIES: "sabnzbd.internal.${CLUSTER_DOMAIN},sabnzbd.private.${CLUSTER_DOMAIN}"
          TZ: ${CLUSTER_TIMEZONE}
        envFrom:
          - secretRef:
              name: sabnzbd-secret
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api?mode=version
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            memory: 2Gi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1306
    runAsGroup: 1306
    fsGroup: 1306
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups:
      - 1002 # downloads_rw
    seccompProfile: { type: RuntimeDefault }

persistence:
  config:
    accessMode: ReadWriteOnce
    storageClass: "longhorn-v2"
    size: 1Gi
    advancedMounts:
      sabnzbd:
        sabnzbd:
          - path: /config
    dataSourceRef:
      apiGroup: volsync.backube
      kind: ReplicationDestination
      name: sabnzbd-bootstrap
  scripts:
    type: configMap
    name: sabnzbd-scripts
    defaultMode: 0775
    advancedMounts:
      sabnzbd:
        sabnzbd:
          - path: /config/scripts
  tmpfs:
    type: emptyDir
    advancedMounts:
      sabnzbd:
        sabnzbd:
          - path: /config/logs
            subPath: logs
          - path: /tmp
            subPath: tmp
  downloads:
    type: nfs
    server: "${STORAGE_IP:-0.0.0.0}"
    path: /Download
    globalMounts:
      - path: /downloads
        subPath: sabnzbd
      - path: /extracted-downloads
        subPath: extracted
      - path: /incomplete-downloads
        subPath: sabnzbd/_Incomplete
  # music:
  #   type: nfs
  #   server: "${STORAGE_IP:-0.0.0.0}"
  #   path: /music
  #   globalMounts:
  #     - path: /music
  # movies:
  #   type: nfs
  #   server: "${STORAGE_IP:-0.0.0.0}"
  #   path: /videos/Spielfilme
  #   globalMounts:
  #     - path: /movies
  # series:
  #   type: nfs
  #   server: "${STORAGE_IP:-0.0.0.0}"
  #   path: /videos/Serien
  #   globalMounts:
  #     - path: /series

route:
  sabnzbd:
    hostnames:
      - sabnzbd.internal.${CLUSTER_DOMAIN}
      - sabnzbd.private.${CLUSTER_DOMAIN}
    parentRefs:
      - name: internal
        namespace: infra-gateway
      - name: private
        namespace: infra-tailscale
    rules:
      - backendRefs:
          - name: sabnzbd
            port: *port

service:
  sabnzbd:
    controller: sabnzbd
    ports:
      http:
        port: *port
