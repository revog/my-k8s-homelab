---
controllers:
  sabnzbd:
    pod:
      annotations:
        reloader.stakater.com/auto: "true"
    containers:
      sabnzbd:
        image:
          repository: ghcr.io/home-operations/sabnzbd
          tag: 5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
        env:
          PUID: 1306
          PGID: 1306
          SABNZBD__PORT: &port 80
          SABNZBD__HOST_WHITELIST_ENTRIES: >-
            sabnzbd, sabnzbd.home-system, sabnzbd.home-system.svc, sabnzbd.home-system.svc.cluster, sabnzbd.home-system.svc.cluster.local, sab.${CLUSTER_DOMAIN}
          TZ: ${CLUSTER_TIMEZONE}
        envFrom:
          - secretRef:
              name: sabnzbd-secret
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api?mode=version
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 60
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            memory: 2Gi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1306
    runAsGroup: 1306
    fsGroup: 1306
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups: [44, 10000]
    seccompProfile: { type: RuntimeDefault }

persistence:
  config:
    accessMode: ReadWriteOnce
    storageClass: "longhorn-v2"
    size: 1Gi
    # globalMounts:
    #   - path: /config
    advancedMounts:
      sabnzbd:
        sabnzbd:
          - path: /config
    dataSourceRef:
      apiGroup: volsync.backube
      kind: ReplicationDestination
      name: sabnzbd-bootstrap
  # scripts:
  #   type: configMap
  #   name: sabnzbd-scripts
  #   defaultMode: 0775
  #   advancedMounts:
  #     sabnzbd:
  #       app:
  #         - path: /config/scripts
  tmpfs:
    type: emptyDir
    advancedMounts:
      sabnzbd:
        sabnzbd:
          - path: /config/logs
            subPath: logs
          - path: /tmp
            subPath: tmp
  # downloads:
  #   type: nfs
  #   server: "${STORAGE_IP:-0.0.0.0}"
  #   path: /Download
  #   globalMounts:
  #     - path: /downloads/sabnzbd
  #       subPath: Download/sabnzbd
  # music:
  #   type: nfs
  #   server: "${STORAGE_IP:-0.0.0.0}"
  #   path: /music
  #   globalMounts:
  #     - path: /music
  #       readOnly: true
  # movies:
  #   type: nfs
  #   server: "${STORAGE_IP:-0.0.0.0}"
  #   path: /videos/movies
  #   globalMounts:
  #     - path: /movies
  # series:
  #   type: nfs
  #   server: "${STORAGE_IP:-0.0.0.0}"
  #   path: /videos/series
  #   globalMounts:
  #     - path: /series

route:
  sabnzbd:
    hostnames:
      - sabnzbd.internal.${CLUSTER_DOMAIN}
      - sabnzbd.private.${CLUSTER_DOMAIN}
    parentRefs:
      - name: internal
        namespace: infra-gateway
      - name: private
        namespace: infra-tailscale
    rules:
      - backendRefs:
          - name: sabnzbd
            port: *port

service:
  sabnzbd:
    controller: sabnzbd
    ports:
      http:
        port: *port
