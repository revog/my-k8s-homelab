---
controllers:
  holyarrs:
    pod:
      annotations:
        reloader.stakater.com/auto: "true"
    containers:
      holyarrs:
        image:
          repository: holyarrs/holyarrs
          tag: 1.2.0@sha256:169d2c90773011fcdce576e44ff40f71e1ddef18408fc367d870bfa57325323e
        env:
          PUID: 1305
          PGID: 1305
          TZ: ${CLUSTER_TIMEZONE}
          HOLYARRS_ALLOWED_HOSTS: "holyarrs.internal.${CLUSTER_DOMAIN},holyarrs.private.${CLUSTER_DOMAIN}"
          HOLYARRS_OIDC_ALLOW_JOIN: "true"
          HOLYARRS_OIDC_ENABLED: "true"
          HOLYARRS_OIDC_ISSUER: https://auth.${CLUSTER_DOMAIN}
          HOLYARRS_OIDC_SCOPES: openid profile email groups
          HOLYARRS_TRUSTED_PROXIES: "${HOMENET_CIDR},${CLUSTER_POD_CIDR},${CLUSTER_SERVICE_CIDR}" # Home Net, Cilium Pod, K8s Services
          HOLYARRS_OIDC_CLIENT_ID:
            valueFrom:
              secretKeyRef:
                name: holyarrs-secret
                key: HOLYARRS_OIDC_CLIENT_ID
          HOLYARRS_OIDC_CLIENT_SECRET_FILE: /run/secrets/holyarrs-secret/HOLYARRS_OIDC_CLIENT_SECRET
          HOLYARRS_OIDC_REDIRECT_URL: https://holyarrs.internal.${CLUSTER_DOMAIN}/api/v1/auth/oidc/callback
          HOLYARRS_TMDB_KEY:
            valueFrom:
              secretKeyRef:
                name: holyarrs-secret
                key: HOLYARRS_TMDB_KEY
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: &port 6262
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1305
    runAsGroup: 1305
    fsGroup: 1305
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups:
      - 1000 # media_rw
      - 1002 # downloads_rw
    seccompProfile: { type: RuntimeDefault }

persistence:
  holyarrs-config:
    accessMode: ReadWriteOnce
    storageClass: "longhorn-v2"
    size: 5Gi
    globalMounts:
      - path: /config
    dataSourceRef:
      apiGroup: volsync.backube
      kind: ReplicationDestination
      name: holyarrs-bootstrap
  holyarrs-secret:
    type: secret
    name: holyarrs-secret
    defaultMode: 0440
    globalMounts:
      - path: /run/secrets/holyarrs-secret
        readOnly: true
  documentary:
    type: nfs
    server: "${STORAGE_IP:-0.0.0.0}"
    path: /videos/Dokumentarfilme
    globalMounts:
      - path: /documentary
  downloads:
    type: nfs
    server: "${STORAGE_IP:-0.0.0.0}"
    path: /Download
    globalMounts:
      - path: /downloads
        subPath: extracted
  movies:
    type: nfs
    server: "${STORAGE_IP:-0.0.0.0}"
    path: /videos/Spielfilme
    globalMounts:
      - path: /movies
  music:
    type: nfs
    server: "${STORAGE_IP:-0.0.0.0}"
    path: /videos/Spielfilme
    globalMounts:
      - path: /music
  series:
    type: nfs
    server: "${STORAGE_IP:-0.0.0.0}"
    path: /videos/Serien
    globalMounts:
      - path: /series


route:
  holyarrs:
    hostnames:
      - holyarrs.internal.${CLUSTER_DOMAIN}
      - holyarrs.private.${CLUSTER_DOMAIN}
    parentRefs:
      - name: internal
        namespace: infra-gateway
      - name: private
        namespace: infra-tailscale
    rules:
      - backendRefs:
          - name: holyarrs
            port: *port

service:
  holyarrs:
    controller: holyarrs
    ports:
      http:
        port: *port
        appProtocol: kubernetes.io/ws
