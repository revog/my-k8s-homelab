---
controllers:
  holyarrs:
    pod:
      annotations:
        reloader.stakater.com/auto: "true"
    containers:
      holyarrs:
        image:
          repository: holyarrs/holyarrs
          tag: 1.1.4@sha256:83553cc4b1939588f5ad3b3249ff2ddf4d3dc75533c20a830e96ef5e67c07114
        env:
          PUID: 1305
          PGID: 1305
          TZ: ${CLUSTER_TIMEZONE}
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &port 6262
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 60
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1305
    runAsGroup: 1305
    fsGroup: 1305
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups: [44, 10000]
    seccompProfile: { type: RuntimeDefault }

persistence:
  config:
    accessMode: ReadWriteOnce
    storageClass: "longhorn-v2"
    size: 1Gi
    globalMounts:
      - path: /config
    dataSourceRef:
      apiGroup: volsync.backube
      kind: ReplicationDestination
      name: holyarrs-bootstrap
  # downloads:
  #   type: nfs
  #   server: "${STORAGE_IP:-0.0.0.0}"
  #   path: /Download
  #   globalMounts:
  #     - path: /downloads
  #       readOnly: false
  music:
    type: nfs
    server: "${STORAGE_IP:-0.0.0.0}"
    path: /music
    globalMounts:
      - path: /music
        readOnly: true
  movies:
    type: nfs
    server: "${STORAGE_IP:-0.0.0.0}"
    path: /videos/Spielfilme
    globalMounts:
      - path: /movies
        readOnly: true
  series:
    type: nfs
    server: "${STORAGE_IP:-0.0.0.0}"
    path: /videos/Serien
    globalMounts:
      - path: /series
        readOnly: true

route:
  holyarrs:
    hostnames:
      - holyarrs.internal.${CLUSTER_DOMAIN}
      - holyarrs.private.${CLUSTER_DOMAIN}
    parentRefs:
      - name: internal
        namespace: infra-gateway
      - name: private
        namespace: infra-tailscale
    rules:
      - backendRefs:
          - name: holyarrs
            port: *port

service:
  holyarrs:
    controller: holyarrs
    ports:
      http:
        port: *port
        appProtocol: kubernetes.io/ws
