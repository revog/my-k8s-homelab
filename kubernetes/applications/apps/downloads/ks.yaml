# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app holyarrs
  namespace: infra-flux
spec:
  path: ./kubernetes/applications/apps/downloads/holyarrs
  targetNamespace: app-downloads
  interval: 15m
  retryInterval: 1m
  timeout: 30m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab
  dependsOn:
    - name: volsync
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_UID: "1305"
      VOLSYNC_GID: "1305"
      VOLSYNC_CLAIM: holyarrs
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_SCHEDULE: "40 3 * * *" # 3:40am
      # VOLSYNC_S3_SCHEDULE: "0 1 * * *" # 1:00am

