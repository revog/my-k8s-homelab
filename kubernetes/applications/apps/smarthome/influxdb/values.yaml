controllers:
  influxdb3:
    containers:
      main:
        image:
          repository: influxdb
          tag: 3.12.0-enterprise
        command:
          - influxdb3
          - serve
          - --node-id=node0
          - --object-store=file
          - --data-dir=/var/lib/influxdb3/data
          - --plugin-dir=/var/lib/influxdb3/plugins
          - --disable-authz=health,ping,metrics
        envFrom:
          - secretRef:
              name: influxdb3-secrets
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &port-api 8181
              initialDelaySeconds: 15
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
