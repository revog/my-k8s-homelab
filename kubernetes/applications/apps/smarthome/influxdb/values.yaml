service:
  influxdb3:
    controller: influxdb3
    ports:
      http:
        port: *port-api
      ui:
        port: &port-ui 8888
        targetPort: 8080

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1500
    runAsGroup: 1500
    fsGroup: 1500
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn-v2
    accessMode: ReadWriteOnce
    size: 15Gi
    advancedMounts:
      influxdb3:
        main:
          - path: /var/lib/influxdb3/data
            subPath: data
          - path: /var/lib/influxdb3/plugins
            subPath: plugins

route:
  api:
    hostnames:
      - influx.internal.${CLUSTER_DOMAIN}
    parentRefs:
      - name: internal
        namespace: infra-gateway
    rules:
      - backendRefs:
          - name: influxdb3
            port: *port-api
  ui:
    hostnames:
      - influx-ui.internal.${CLUSTER_DOMAIN}
      - influx-ui.private.${CLUSTER_DOMAIN}
    parentRefs:
      - name: internal
        namespace: infra-gateway
      - name: private
        namespace: infra-tailscale
    rules:
      - backendRefs:
          - name: influxdb3
            port: *port-ui
