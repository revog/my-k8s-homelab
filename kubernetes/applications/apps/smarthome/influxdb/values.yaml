---
controllers:
  influxdb3:
    containers:
      main:
        image:
          repository: influxdb
          tag: 3.12.2-enterprise
        env:
          INFLUXDB3_CLUSTER_ID: "cluster0"
          INFLUXDB3_NODE_ID: "node0"
          INFLUXDB3_OBJECT_STORE: "file"
          INFLUXDB3_DATA_DIR: "/var/lib/influxdb3/data"
          INFLUXDB3_PLUGIN_DIR: "/var/lib/influxdb3/plugins"
          INFLUXDB3_MODE: "all,webui"
          INFLUXDB3_DISABLE_AUTHZ: "health,ping,metrics"
        envFrom:
          - secretRef:
              name: influxdb3-secrets
        probes:
          startup:                     # Handles the intensive startup phase (WAL replay & catalog wait timeouts). Liveness and Readiness probes are completely disabled until this probe succeeds.
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &port 8181
              initialDelaySeconds: 5   # Short buffer before the first check begins
              periodSeconds: 5         # Check frequency during startup
              failureThreshold: 24     # 24 attempts * 5s = 120 seconds (2 minutes) max time allowed to start
          liveness:                    # Monitors the health of the container during active runtime.
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8181
              initialDelaySeconds: 0   # No delay needed because the startupProbe guards this phase
              periodSeconds: 10        # Checks every 10 seconds to ensure the engine is responsive
              timeoutSeconds: 5        # Timeout window if the engine is temporarily slow
              failureThreshold: 3      # Pod will be restarted only after 3 consecutive failures
          readiness:                   # Ensures the container is ready to accept traffic. This probe is crucial for load balancers and service routing.
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8181
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 3
              successThreshold: 1      # Immediately allow traffic on the first successful check
              failureThreshold: 2      # Quickly pull the node out of routing if it starts failing
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi

service:
  influxdb3:
    controller: influxdb3
    ports:
      http:
        port: *port

defaultPodOptions:
  terminationGracePeriodSeconds: 60  # Ensures the pod has enough time to gracefully shut down, allowing InfluxDB to close connections and flush data.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1500
    runAsGroup: 1500
    fsGroup: 1500
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn-v2
    accessMode: ReadWriteOnce
    size: 30Gi
    advancedMounts:
      influxdb3:
        main:
          - path: /var/lib/influxdb3/data
            subPath: data
          - path: /var/lib/influxdb3/plugins
            subPath: plugins
  ui-tmp:
    enabled: true
    type: emptyDir
    advancedMounts:
      influxdb3:
        main:
          - path: /tmp
            subPath: tmp
route:
  influxdb3:
    hostnames:
      - influx.internal.${CLUSTER_DOMAIN}
      - influx.private.${CLUSTER_DOMAIN}
    parentRefs:
      - name: internal
        namespace: infra-gateway
      - name: private
        namespace: infra-tailscale
    rules:
      - backendRefs:
          - name: influxdb3
            port: *port
