# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmrelease.yaml
  - namespace.yaml
  - ocirepository.yaml
#  - secret.age.enc.yaml

components:
  - ../../../components/volsync

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: homeassistant-values
    files:
      - values.yaml
  - name: homeassistant-configuration-yaml
    files:
      - ./resources/configuration.yaml
