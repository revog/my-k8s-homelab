---
controllers:
  homeassistant:
    pod:
      annotations:
        reloader.stakater.com/auto: "true"
    containers:
      homeassistant:
        image:
          repository: ghcr.io/home-operations/home-assistant
          tag: 2026.7.3@sha256:7a6951bc274d802206d9ab2e76885fec8ba4f41707ae31d81207ebe5c73b84fb
        env:
          TZ: ${CLUSTER_TIMEZONE}
        # envFrom:
        #   - secretRef:
        #       name: home-assistant-secret
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &haPort 8123
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            spec:
              initialDelaySeconds: 30
              periodSeconds: 10
              failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 2Gi
      code-server:
        image:
          repository: ghcr.io/coder/code-server
          tag: 4.138.0@sha256:81706b71ace316157850cbcfb574714d1067249c107a415b3a03dc6b613ebfbc
        args:
          [
            "--auth",
            "none",
            "--user-data-dir",
            "/config/.vscode",
            "--extensions-dir",
            "/config/.vscode",
            "--port",
            "12321",
            "/config",
          ]
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 512Mi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1006
    runAsGroup: 1006
    fsGroup: 1006
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups: [44, 10000]
    seccompProfile: { type: RuntimeDefault }

persistence:
  config:
    accessMode: ReadWriteOnce
    labels:
      volsync.backube/restore: "true"
    storageClass: longhorn-v2
    size: 2Gi
    globalMounts:
      - path: /config
  logs:
    type: emptyDir
    globalMounts:
      - path: /config/logs
  tts:
    type: emptyDir
    globalMounts:
      - path: /config/tts
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp

route:
  homeassistant:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: Infrastructure
      gethomepage.dev/name: Home Assistant
      gethomepage.dev/icon: ha.png
      gethomepage.dev/description: Smart Home
    hostnames:
      - homeassistant.internal.${CLUSTER_DOMAIN}
      - homeassistant.private.${CLUSTER_DOMAIN}
    parentRefs:
      - name: internal
        namespace: infra-gateway
      - name: private
        namespace: infra-tailscale
    rules:
      - backendRefs:
          - name: homeassistant
            port: *haPort

service:
  homeassistant:
    controller: homeassistant
    ports:
      http:
        appProtocol: kubernetes.io/ws
        port: *haPort
      code-server:
        port: &codePort 12321
