---
controllers:
  homeassistant:
    pod:
      annotations:
        reloader.stakater.com/auto: "true"
    containers:
      homeassistant:
        image:
          repository: ghcr.io/home-operations/home-assistant
          tag: 2026.8.3@sha256:16ca445e58fa71d4f7ff287d4e9793ea690ccae932a5e200852371425cd7abb0
        env:
          TZ: ${CLUSTER_TIMEZONE}
        # envFrom:
        #   - secretRef:
        #       name: home-assistant-secret
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &haPort 8123
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            spec:
              initialDelaySeconds: 30
              periodSeconds: 10
              failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 2Gi
      code-server:
        image:
          repository: ghcr.io/coder/code-server
          tag: 4.139.1@sha256:0c067c3cf09ed1830ce282387826be8feefef8a5828f462791c2df3f1007ee17
        args:
          [
            "--auth",
            "none",
            "--user-data-dir",
            "/config/.vscode",
            "--extensions-dir",
            "/config/.vscode",
            "--port",
            "12321",
            "/config",
          ]
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 512Mi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1006
    runAsGroup: 1006
    fsGroup: 1006
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups: [44, 10000]
    seccompProfile: { type: RuntimeDefault }

persistence:
  config:
    accessMode: ReadWriteOnce
    labels:
      volsync.backube/restore: "true"
    storageClass: longhorn-v2
    size: 2Gi
    globalMounts:
      - path: /config
  config-file:
    type: configMap
    name: homeassistant-configuration-yaml
    globalMounts:
      - path: /config/configuration.yaml
        subPath: configuration.yaml
        readOnly: true
  logs:
    type: emptyDir
    globalMounts:
      - path: /config/logs
  tts:
    type: emptyDir
    globalMounts:
      - path: /config/tts
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  venv: # runtime-installed integration requirements survive restarts
    accessMode: ReadWriteOnce
    storageClass: longhorn-v2
    size: 2Gi
    globalMounts:
      - path: /config/.venv

route:
  homeassistant:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: Infrastructure
      gethomepage.dev/name: Home Assistant
      gethomepage.dev/icon: ha.png
      gethomepage.dev/description: Smart Home
    hostnames:
      - homeassistant.internal.${CLUSTER_DOMAIN}
      - homeassistant.private.${CLUSTER_DOMAIN}
    parentRefs:
      - name: internal
        namespace: infra-gateway
      - name: private
        namespace: infra-tailscale
    rules:
      - backendRefs:
          - name: homeassistant
            port: *haPort

service:
  homeassistant:
    controller: homeassistant
    ports:
      http:
        appProtocol: kubernetes.io/ws
        port: *haPort
      code-server:
        port: &codePort 12321
