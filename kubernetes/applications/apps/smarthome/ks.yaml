# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app homeassistant
  namespace: infra-flux
spec:
  path: ./kubernetes/applications/apps/smarthome/homeassistant
  targetNamespace: app-smarthome
  interval: 15m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_UID: "1008"
      VOLSYNC_GID: "1008"
      VOLSYNC_CLAIM: homeassistant-config
      VOLSYNC_CAPACITY: 2Gi
      VOLSYNC_SCHEDULE: "30 5 * * *" # 5:30am
      VOLSYNC_S3_SCHEDULE: "45 5 * * *" # 5:45am

