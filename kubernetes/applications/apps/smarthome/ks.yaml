# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zigbee2mqtt
  namespace: infra-flux
spec:
  path: ./kubernetes/applications/apps/smarthome/zigbee2mqtt
  targetNamespace: app-smarthome
  interval: 15m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab
  dependsOn:
    - name: homeassistant
    - name: mosquitto
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_UID: "1010"
      VOLSYNC_GID: "1010"
      VOLSYNC_CLAIM: zigbee2mqtt
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_SCHEDULE: "40 5 * * *" # 5:40am
      VOLSYNC_S3_SCHEDULE: "50 5 * * *" # 5:55am
      ZEROSCALER_JOB_NAME: icmp-slzb-probe

