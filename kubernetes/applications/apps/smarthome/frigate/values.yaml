---
controllers:
  frigate:
    pod:
      annotations:
        reloader.stakater.com/auto: "true"
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      resourceClaims:
        - name: intel-gpu
          resourceClaimTemplateName: frigate-gpu
    containers:
      frigate:
        image:
          repository: ghcr.io/blakeblackshear/frigate
          tag: 0.18.0@sha256:9678a83a76e4730ac7d9ea7428370e32ae656d6b312aaad30d6c69f3fef14d35 # Passe den Tag/Digest bei Bedarf an
        env:
          TZ: ${CLUSTER_TIMEZONE}
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/version
                port: &port 5000
              initialDelaySeconds: 5
              periodSeconds: 15
              timeoutSeconds: 2
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            spec:
              initialDelaySeconds: 10
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: true # s6-overlay must be able to change permissions
          readOnlyRootFilesystem: false # set to false until better way found running frigate in non-root env
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "SETGID", "SETUID", "FOWNER"] # s6-overlay needs this capabilities during startup
        resources:
          requests:
            cpu: 500m
            memory: 1000Mi
          limits:
            memory: 4Gi
          claims:
            - name: intel-gpu

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1006
    runAsGroup: 1006
    fsGroup: 1006
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups: [44, 10000]
    seccompProfile: { type: RuntimeDefault }
  nodeSelector:
    intel.feature.node.kubernetes.io/gpu: "true"

persistence:
  config:
    accessMode: ReadWriteOnce
    storageClass: longhorn-v2
    size: 2Gi
    globalMounts:
      - path: /config
  shm: # Frigate uses shared-memory for camera raw data
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    globalMounts:
      - path: /dev/shm
  # media:
  #   type: nfs
  #   server: ${STORAGE_IP}
  #   path: /mnt/recordings
  #   globalMounts:
  #     - path: /media/frigate
  # run-dir:
  #   type: emptyDir
  #   medium: Memory
  #   globalMounts:
  #     - path: /run
  # nginx-conf:
  #   type: emptyDir
  #   medium: Memory
  #   globalMounts:
  #     - path: /usr/local/nginx/conf
  # letsencrypt:
  #   type: emptyDir
  #   medium: Memory
  #   globalMounts:
  #     - path: /etc/letsencrypt

route:
  frigate:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: Infrastructure
      gethomepage.dev/name: Frigate
      gethomepage.dev/icon: frigate.png
      gethomepage.dev/description: NVR & AI Object Detection
      gethomepage.dev/widget.type: frigate
      gethomepage.dev/widget.url: http://frigate.infrastructure:5000
    hostnames:
      - frigate.internal.${CLUSTER_DOMAIN}
      - frigate.private.${CLUSTER_DOMAIN}
    parentRefs:
      - name: internal
        namespace: infra-gateway
      - name: private
        namespace: infra-tailscale
    rules:
      - backendRefs:
          - name: frigate
            port: *port

service:
  frigate:
    controller: frigate
    ports:
      http:
        appProtocol: kubernetes.io/ws
        port: *port
        primary: true
      # go2rtc:
      #   port: 1984
      rtsp:
        port: 8554
      webrtc-tcp:
        port: 8555
        protocol: TCP
      webrtc-udp:
        port: 8555
        protocol: UDP
