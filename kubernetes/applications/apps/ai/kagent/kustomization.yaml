---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ciliumnetworkpolicy.yaml
  - helmrelease.yaml
  - httproute.yaml
  - ocirepository.yaml
  - runtimeclass.yaml
  - secret.age.enc.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: kagent-values
    files:
      - values.yaml
