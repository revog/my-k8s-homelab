---
config:
  server:
    auth:
      mode: trusted-proxy
      userIdClaim: email
  substrate:
    enabled: false

controller:
  metrics:
    enabled: true
  service:
    type: ClusterIP

database:
  postgres:
    ownerConnectionStringSecretRef:
      name: kagent-postgres-owner
      key: uri
    readWriteConnectionStringSecretRef:
      name: kagent-postgres-readwrite
      key: uri

oauth2-proxy:
  enabled: true
  config:
    existingSecret: kagent-oidc-secret
  extraArgs:
    provider: oidc
    oidc-issuer-url: "https://auth.${CLUSTER_DOMAIN}"
    redirect-url: "https://auth.${CLUSTER_DOMAIN}/oauth2/callback"
    reverse-proxy: true
    scope: "openid profile email groups"

providers: null

ui:
  httpRoute:
    enabled: false # Explicitely disabled to avoid bypassing oidc-proxy (separate YAML manifest)
  service:
    type: ClusterIP
