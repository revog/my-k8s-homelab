---
config:
  server:
    auth:
      mode: trusted-proxy
      userIdClaim: email
  substrate:
    apiEndpoint: dns:///agent-substrate-api.app-ai-ate.svc:443
    routerUrl: https://agent-substrate-atenet-router.app-ai-ate.svc:443
    actorJwtIssuer: https://agent-substrate-idp.app-ai-ate.svc

controller:
  metrics:
    enabled: true
  service:
    type: ClusterIP

database:
  postgres:
    ownerConnectionStringSecretRef:
      name: kagent-postgres-owner
      key: uri
    readWriteConnectionStringSecretRef:
      name: kagent-postgres-readwrite
      key: uri

harnesses:
  enabled: true
  snapshotLocation: s3://ate-snapshots/kagent/

oauth2-proxy:
  enabled: true
  config:
    existingSecret: kagent-oidc-secret
  extraArgs:
    provider: oidc
    oidc-issuer-url: "https://auth.${CLUSTER_DOMAIN}"
    redirect-url: "https://kagent.internal.${CLUSTER_DOMAIN}/oauth2/callback"
    reverse-proxy: true
    scope: "openid profile email groups"
  extraEnv:
    - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD  # Allows to use PKCE
      value: S256
    - name: KAGENT_OAUTH2_PROXY_SIGNIN_TEMPLATE_CHECKSUM
      value: '{{ include "kagent.oauth2ProxySignInHTML" . | sha256sum }}'
    - name: UPSTREAM_URL
      value: "http://kagent-ui:8080"

providers: null

substrateWorkerPool:
  create: true
  name: kagent-default
  replicas: 1
  sandboxClass: gvisor

ui:
  httpRoute:
    enabled: false # Explicitely disabled to avoid bypassing oidc-proxy (separate YAML manifest)
  service:
    type: ClusterIP
