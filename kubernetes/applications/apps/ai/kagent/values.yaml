---
config:
  server:
    auth:
      mode: trusted-proxy
      userIdClaim: email

controller:
  metrics:
    enabled: true
  service:
    type: ClusterIP

database:
  postgres:
    ownerConnectionStringSecretRef:
      name: kagent-postgres-owner
      key: uri
    readWriteConnectionStringSecretRef:
      name: kagent-postgres-readwrite
      key: uri

oauth2-proxy:
  enabled: true
  config:
    existingSecret: kagent-oidc-secret
  extraArgs:
    provider: oidc
    oidc-issuer-url: "https://auth.${CLUSTER_DOMAIN}"
    redirect-url: "https://kagent.internal.${CLUSTER_DOMAIN}/oauth2/callback"
    reverse-proxy: true
    scope: "openid profile email groups"
  extraEnv:
    - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD  # Allows to use PKCE
      value: S256
    - name: KAGENT_OAUTH2_PROXY_SIGNIN_TEMPLATE_CHECKSUM
      value: '{{ include "kagent.oauth2ProxySignInHTML" . | sha256sum }}'
    - name: UPSTREAM_URL
      value: "http://kagent-ui:8080"

providers: null

ui:
  httpRoute:
    enabled: false # Explicitely disabled to avoid bypassing oidc-proxy (separate YAML manifest)
  service:
    type: ClusterIP
