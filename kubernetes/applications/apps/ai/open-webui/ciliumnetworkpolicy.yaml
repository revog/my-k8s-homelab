---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-from-openwebui-to-postgres
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: postgres18-kagent
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: open-webui
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  
