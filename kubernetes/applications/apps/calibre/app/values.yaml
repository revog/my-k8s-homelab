---
controllers:
  main:
    containers:
      calibre:
        image:
          repository: ghcr.io/new-usemame/calibre-web-nextgen
          tag: v4.1.74@sha256:7d9f614755b875e85951d430ae3314c178e1a74940088896f33ddcb1a5d31121
        env:
          TZ: ${CLUSTER_TIMEZONE}
          PUID: ${VOLSYNC_UID}
          PGID: ${VOLSYNC_GID}
          S6_READ_ONLY_ROOT: "1" # inform s6-overlay about read-only root fs
          S6_VERBOSITY: "1"      # make s6 logging less chatty (only warnings & errors)
          CWA_BOOK_INGEST: "/cwa-book-ingest"
          CWA_INGEST_FOLDER: "/cwa-book-ingest"
          # DOCKER_MODS: "linuxserver/mods:universal-calibre"  # include needed resources for ebook-convert/kindle-epub-fixer
          CALIBRE_SERVER_PORT: "8080"
          CWA_COVER_BOOST: "true"
          CWA_PREVIEW_CACHE_MAX_MB: "1024"
          CWNG_TRUSTED_ORIGINS: "https://bookstore.${CLUSTER_DOMAIN},https://bookstore.internal.${CLUSTER_DOMAIN},https://bookstore.private.${CLUSTER_DOMAIN}"
          GENERIC_OAUTH_ENABLED: "true"
          GENERIC_OAUTH_CLIENT_ID:
            valueFrom:
              secretKeyRef:
                name: calibre-web-nextgen-secrets
                key: client-id
          GENERIC_OAUTH_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: calibre-web-nextgen-secrets
                key: client-secret
          # GENERIC_OAUTH_CLIENT_SECRET_FILE: /run/secrets/calibre-web-nextgen-secrets
          GENERIC_OAUTH_SERVER_URL: https://auth.${CLUSTER_DOMAIN}
          GENERIC_OAUTH_AUTH_URL: https://auth.${CLUSTER_DOMAIN}/authorize
          GENERIC_OAUTH_TOKEN_URL: https://auth.${CLUSTER_DOMAIN}/api/oidc/token
          GENERIC_OAUTH_USERINFO_URL: https://auth.${CLUSTER_DOMAIN}/api/oidc/userinfo
          GENERIC_OAUTH_SCOPE: "openid profile email groups"
          GENERIC_OAUTH_USERNAME_MAPPER: "preferred_username"
          GENERIC_OAUTH_EMAIL_MAPPER: "email"
          GENERIC_OAUTH_LOGIN_BUTTON: "Sign-in with SSO"
          GENERIC_OAUTH_GROUP_CLAIM: "groups"
          GENERIC_OAUTH_REQUIRE_GROUP: "true"
          GENERIC_OAUTH_ALLOWED_GROUPS: "app-calibre-user,app-calibre-admin"
          GENERIC_OAUTH_ADMIN_GROUP: "app-calibre-admin"
          GENERIC_OAUTH_DEFAULT_ROLE: "download,viewer"
          # HARDCOVER_TOKEN:  # Hardcover Metadata Provider (server-wide lookup)
          #   valueFrom:
          #     secretKeyRef:
          #       name: calibre-web-nextgen-secrets
          #       key: hardcover-token
          # HARDCOVER_SYNC_ENABLED: "true"
          NETWORK_SHARE_MODE: "true" # Required as /calibre-library is on NFS/SMB (disables SQLite WAL & startup chown)
          OAUTH_SSL_STRICT: "1"
          SESSION_COOKIE_SECURE: "true"
          TRUSTED_PROXY_COUNT: "2" # passes two reverse proxies (Cloudflare Tunnel → Gateway API → Service → Pod)
          TRUSTED_PROXY_NETWORKS: "${HOMENET_CIDR},${CLUSTER_POD_CIDR},${CLUSTER_SERVICE_CIDR}" # Home Net, Cilium Pod, K8s Services
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &port 8083
              initialDelaySeconds: 15
              periodSeconds: 20
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: *port
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 36 # Allows up to 3 minutes (36 * 5s) for initial DB/service startup
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: ${VOLSYNC_UID}
    runAsGroup: ${VOLSYNC_GID}
    fsGroup: ${VOLSYNC_GID}
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups: []
    seccompProfile: { type: RuntimeDefault }

persistence:
  books:
    enabled: true
    type: persistentVolumeClaim
    storageClass: qnap-nfs
    accessMode: ReadWriteMany
    size: 5Gi
    globalMounts:
      - path: /calibre-library
  config:
    enabled: true
    accessMode: ReadWriteOnce
    globalMounts:
      - path: /config
    # labels:
    #   volsync.backube/restore: "true"
    size: 1Gi
    storageClass: longhorn-v2
    type: persistentVolumeClaim
  secret:
    type: secret
    name: calibre-web-nextgen-secrets
    defaultMode: 0440
    globalMounts:
      - path: /run/secrets/calibre-web-nextgen-secrets
        readOnly: true
  ingest:
    type: emptyDir
#    type: nfs
#    server: ${STORAGE_IP}
#    path: /Downloads/ebooks
    globalMounts:
      - path: /cwa-book-ingest
  log:
    type: emptyDir
    globalMounts:
      - path: /var/log
  run:
    type: emptyDir
    medium: Memory
    sizeLimit: 64Mi
    globalMounts:
      - path: /run
  tmp:
    type: emptyDir
    medium: Memory
    globalMounts:
      - path: /tmp

route:
  calibre:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: Entertainment
      gethomepage.dev/name: Calibre
      gethomepage.dev/icon: calibre-web-ng.png
      gethomepage.dev/description: Bookstore
    hostnames:
      - books.${CLUSTER_DOMAIN}
      - books.internal.${CLUSTER_DOMAIN}
      - books.private.${CLUSTER_DOMAIN}
    parentRefs:
      - name: internal
        namespace: infra-gateway
      - name: private
        namespace: infra-tailscale
      - name: public
        namespace: infra-gateway
    rules:
      - filters:
          - type: RequestHeaderModifier
            requestHeaderModifier:
              set:
                - name: X-Forwarded-Proto  # Force https scheme so OIDC generates https redirect URIs behind HTTP-terminated Cloudflare Tunnel
                  value: https
        backendRefs:
          - name: calibre-web-nextgen
            port: *port

service:
  calibre:
    controller: main
    ports:
      http:
        port: *port
