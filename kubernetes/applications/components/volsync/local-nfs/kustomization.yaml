---
# yaml-language-server: $schema=https://json.schemastore.org/component.json
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - replicationdestination.yaml
  - replicationsource.yaml
  - secret.age.enc.yaml

# This block intercepts your application's PVC and adds the resource policy dynamically
patches:
  - target:
      kind: PersistentVolumeClaim
      labelSelector: volsync.home.arpa/backup=true
    patch: |
      - op: add
        path: /metadata/annotations/helm.sh~1resource-policy
        value: keep

# This block synchronizes your app's actual PVC name directly into VolSync resources
replacements:
  - source:
      kind: PersistentVolumeClaim
      fieldPath: metadata.name
    targets:
      - select:
          kind: ReplicationSource
        fieldPaths:
          - spec.sourcePVC
          - metadata.name
      - select:
          kind: ReplicationDestination
        fieldPaths:
          - metadata.name
