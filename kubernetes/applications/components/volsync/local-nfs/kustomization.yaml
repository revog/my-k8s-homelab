---
# yaml-language-server: $schema=https://json.schemastore.org/component.json
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - replicationdestination.yaml
  - replicationsource.yaml
  - secret.age.enc.yaml

# apply patch to every helmrelease and add postrender patch for setting dataSourceRef
patches:
  - target:
      kind: HelmRelease
    patch: |
      - op: add
        path: /spec/postRenderers
        value:
          - kustomize:
              patches:
                # Case for simple PVCs
                - target:
                    kind: PersistentVolumeClaim
                    labelSelector: volsync.backube/restore=true
                  patch: |
                    - op: add
                      path: /spec/dataSourceRef
                      value:
                        kind: ReplicationDestination
                        apiGroup: volsync.backube
                        name: ${APP}-bootstrap

                # Case for PVCs created by StatefulSets
                - target:
                    kind: StatefulSet
                    labelSelector: volsync.backube/restore=true
                  patch: |
                    - op: add
                      path: /spec/volumeClaimTemplates/0/spec/dataSourceRef
                      value:
                        kind: ReplicationDestination
                        apiGroup: volsync.backube
                        name: ${APP}-bootstrap
