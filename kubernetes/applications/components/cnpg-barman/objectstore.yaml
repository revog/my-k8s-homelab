apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cloudflare-s3-${DB}
spec:
  configuration:
    destinationPath: s3://cnpg-barman/${DB}
    endpointURL: ${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: barman-s3-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: barman-s3-secret
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
  retentionPolicy: "${BARMAN_RETENTION:=7d}"
