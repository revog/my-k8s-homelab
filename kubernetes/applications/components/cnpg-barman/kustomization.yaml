---
# yaml-language-server: $schema=https://json.schemastore.org/component.json
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - scheduledbackup.yaml

secretGenerator:
  - name: barman-s3-secret
    literals:
      - ACCESS_KEY_ID=${VOLSYNC_CLOUDFLARE_S3_ACCESS_KEY}
      - SECRET_ACCESS_KEY=${VOLSYNC_CLOUDFLARE_S3_SECRET_ACCESS_KEY}

patches:
  # Patch Cluster resource and add backup parameters dynamically
  - target:
      version: v1
      group: postgresql.cnpg.io
      kind: Cluster
      name: ${DB}
    patch: |-
      - op: add
        path: /spec/backup
        value:
          barmanObjectStore:
            destinationPath: "s3://cnpg-barman/${DB}"
            endpointURL: "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
            s3Credentials:
              accessKeyId:
                name: barman-s3-secret
                key: ACCESS_KEY_ID
              secretAccessKey:
                name: barman-s3-secret
                key: SECRET_ACCESS_KEY
            wal:
              compression: gzip
          retentionPolicy: "${BARMAN_RETENTION:=7d}"
