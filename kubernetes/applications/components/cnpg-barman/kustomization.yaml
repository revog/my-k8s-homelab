---
# yaml-language-server: $schema=https://json.schemastore.org/component.json
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - objectstore.yaml
  - scheduledbackup.yaml
  - secret.age.enc.yaml

patches:
  # Patch Cluster resource and add backup parameters dynamically
  - target:
      version: v1
      group: postgresql.cnpg.io
      kind: Cluster
    patch: |-
      - op: add
        path: /spec/plugins
        value:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
              barmanObjectName: cloudflare-s3-${DB}
