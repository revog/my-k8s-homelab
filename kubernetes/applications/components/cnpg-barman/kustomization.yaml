---
# yaml-language-server: $schema=https://json.schemastore.org/component.json
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - scheduledbackup.yaml
  - secret.age.enc.yaml

patches:
  # Patch Cluster resource and add backup parameters dynamically
  - target:
      version: v1
      group: postgresql.cnpg.io
      kind: Cluster
      name: ${DB}
    patch: |
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: ${DB}
      spec:
        backup:
          barmanObjectStore:
            destinationPath: "s3://cnpg-barman/${DB}"
            endpointURL: "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
            s3Credentials:
              accessKeyId:
                name: barman-s3-secret
                key: ACCESS_KEY_ID
              secretAccessKey:
                name: barman-s3-secret
                key: SECRET_ACCESS_KEY
            wal:
              compression: gzip
          retentionPolicy: "${BARMAN_RETENTION:=7d}"
