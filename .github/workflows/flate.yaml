---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Renders every Kustomization and HelmRelease offline with flate (the replacement for the
# sunset flux-local), fails on anything that won't render, and comments the rendered diff
# against main. Renovate automerge waits for this check.
name: Flate

on:
  pull_request:
    branches:
      - main
    paths:
      - kubernetes/**
      - .github/scripts/flate-*.sh
      - .github/workflows/flate.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: "0.6.5"

jobs:
  render:
    name: Flate - Render
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      diff: ${{ steps.diff.outputs.diff }}
    steps:
      - name: Checkout Pull Request Branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pull
          persist-credentials: false

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: ${{ env.FLATE_VERSION }}
          cache: "true"

      # The pull request's copy of the scripts stages both trees, so a change to them is tested too.
      - name: Stage
        run: |
          pull/.github/scripts/flate-stage.sh pull/kubernetes "$RUNNER_TEMP/stage/pull"
          pull/.github/scripts/flate-stage.sh base/kubernetes "$RUNNER_TEMP/stage/base"

      - name: Debug stage
        run: |
          grep -R "CLUSTER_DOMAIN" "$RUNNER_TEMP/stage/base" | head -20 || true
          grep -R "CLUSTER_DOMAIN" "$RUNNER_TEMP/stage/pull" | head -20 || true
      
          grep -R "<ommited>" "$RUNNER_TEMP/stage/base" | head -20 || true
          grep -R "<ommited>" "$RUNNER_TEMP/stage/pull" | head -20 || true

      # The setup action exports FLATE_BASE, which switches flate into git-based changed-only
      # mode; the staged trees aren't git checkouts and are rendered in full instead.
      - name: Test
        working-directory: ${{ runner.temp }}/stage/pull
        run: |
          unset FLATE_BASE
          flate test all --path . --no-progress

      - name: Diff
        id: diff
        run: |
          unset FLATE_BASE
          (cd "$RUNNER_TEMP/stage/base" && flate build all --path . --no-progress) > "$RUNNER_TEMP/base.yaml"
          (cd "$RUNNER_TEMP/stage/pull" && flate build all --path . --no-progress) > "$RUNNER_TEMP/pull.yaml"
          base/.github/scripts/flate-diff.sh "$RUNNER_TEMP/base.yaml" "$RUNNER_TEMP/pull.yaml" > diff.patch

          cat diff.patch
          # A PR comment holds 65536 characters.
          if [ "$(wc -c < diff.patch)" -gt 60000 ]; then
            head -c 60000 diff.patch > diff.trimmed && mv diff.trimmed diff.patch
            printf '\n... diff truncated at 60000 bytes\n' >> diff.patch
          fi
          delim="FLATE_DIFF_$(openssl rand -hex 16)"
          {
            echo "diff<<$delim"
            cat diff.patch
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Debug rendered manifests
        run: |
          grep -n "paperless.internal" "$RUNNER_TEMP/base.yaml" | head
          grep -n "paperless.internal" "$RUNNER_TEMP/pull.yaml" | head
          grep -R "CLUSTER_DOMAIN" "$RUNNER_TEMP/base.yaml" | head
          grep -R "CLUSTER_DOMAIN" "$RUNNER_TEMP/pull.yaml" | head
          grep -R "<ommited>" "$RUNNER_TEMP/base.yaml" | head
          grep -R "<ommited>" "$RUNNER_TEMP/pull.yaml" | head

      - name: Debug Diff output
        run: |
          echo "Length:"
          wc -c diff.patch
          echo "Step output exists:"
          test -n "${{ steps.diff.outputs.diff }}" && echo YES || echo NO

  # Kept apart from render so no pull request code runs alongside the bot token.
  comment:
    if: ${{ needs.render.outputs.diff != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: render
    name: Flate - Comment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Debug received output
        run: |
          echo '${{ needs.render.outputs.diff }}' | head
          echo "Length:"
          echo '${{ needs.render.outputs.diff }}' | wc -c
  
      - name: Add Comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ${{ github.event.pull_request.number }}/kubernetes/flate
          message: |-
            ```diff
            ${{ needs.render.outputs.diff }}
            ```
