name: Update Kromgo Badges

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual trigger via the GitHub dashboard

jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push the updated SVGs back to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Badges Directory
        run: mkdir -p .github/badges

      - name: Download All Badges
        env:
          BASE_DOMAIN: ${{ secrets.KROMGO_DOMAIN }}
        run: |
          if [ -z "$BASE_DOMAIN" ]; then
            echo "ERROR: The secret KROMGO_DOMAIN is not set or empty in GitHub Settings!"
            exit 1
          fi

          # Define the list of badge IDs inside an array
          BADGES=(
            "talos_version"
            "kubernetes_version"
            "flux_version"
            "cluster_node_count"
            "cluster_pod_count"
            "cluster_cpu_usage"
            "cluster_memory_usage"
            "cluster_age_days"
            "cluster_uptime_days"
            "cluster_alert_count"
          )

          # Loop through the list sequentially on a single runner
          for badge in "${BADGES[@]}"; do
            echo "Fetching badge for: ${badge}..."
            curl -sL "${BASE_DOMAIN}/badges/${badge}" -o ".github/badges/${badge}.svg"
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .github/badges/*.svg
          
          # Only commit if any of the badge files actually changed
          if git diff --staged --quiet; then
            echo "No changes detected in badges."
          else
            git commit -m "chore: update kromgo status badges [skip ci]"
            git push
          fi
