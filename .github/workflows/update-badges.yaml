name: Update Kromgo Badges

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual trigger via the GitHub dashboard

jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push the updated SVGs back to the repository
    
    strategy:
      # matrix list contains all your badge IDs from your kromgo config
      matrix:
        badge:
          - talos_version
          - kubernetes_version
          - flux_version
          - cluster_node_count
          - cluster_pod_count
          - cluster_cpu_usage
          - cluster_memory_usage
          - cluster_age_days
          - cluster_uptime_days
          - cluster_alert_count

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Badges Directory
        run: mkdir -p .github/badges

      - name: Download Badge
        env:
          BASE_DOMAIN: ${{ secrets.KROMGO_DOMAIN }}
          BADGE_ID: ${{ matrix.badge }}
        run: |
          # Check if the secret is empty before running curl
          if [ -z "$BASE_DOMAIN" ]; then
            echo "ERROR: The secret KROMGO_DOMAIN is not set or empty in GitHub Settings!"
            exit 1
          fi
          # Construct the full, uncensored URL dynamically in the background
          echo "Fetching badge for: ${BADGE_ID}..."
          curl -sL "${BASE_DOMAIN}/badges/${BADGE_ID}" -o ".github/badges/${BADGE_ID}.svg"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          git add .github/badges/*.svg
          
          # Only commit if the badge files actually changed
          if git diff --staged --quiet; then
            echo "No changes detected in badges."
          else
            git commit -m "chore: update kromgo status badges [skip ci]"
            git push
          fi
